name: Rename branding to BookTrip

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-booktrip.yml'

permissions:
  contents: write

jobs:
  rename-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace Gooligoog with BookTrip
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ "$file" = ".github/workflows/rename-booktrip.yml" ] && continue
            sed -i 's/Gooligoog/BookTrip/g' "$file"
          done < <(git grep -Il 'Gooligoog' -- '*.html' '*.css' '*.js' '*.md' '*.json' '*.txt' || true)

      - name: Commit branding update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No branding strings needed changing."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename Gooligoog branding to BookTrip"
          git push origin HEAD:main
