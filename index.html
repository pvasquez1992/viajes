<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="es">
<title>BookTrip</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="stylesheet" href="css/home.css?v=20261010"><style>/* Respaldo si Cloudflare no sirve CSS externo */body{margin:0;min-height:100vh;background:#101923;color:#f6f7fa;font:16px/1.5 system-ui,Arial,sans-serif}a{color:#a9d5ef}.site-header-inner,.home-shell,.site-footer{max-width:1100px;margin:auto;padding:20px}.site-header-inner{display:flex;justify-content:space-between;gap:15px;align-items:center}.site-header nav{display:flex;flex-wrap:wrap;gap:16px}.brand{font-size:25px;font-weight:800}.brand img{width:35px;vertical-align:middle}.home-hero{padding:35px 0}.magic-copy{font-size:clamp(22px,3vw,34px);max-width:760px}.library-panel{padding:20px 0}.library-top{display:flex;align-items:center;justify-content:space-between;gap:20px}.library-tools{display:flex;flex-wrap:wrap;gap:15px;align-items:center;margin:18px 0}.filter-row{display:flex;gap:8px;flex-wrap:wrap}.filter-button{background:#243647;color:#fff;border:1px solid #506777;border-radius:25px;padding:8px 14px;cursor:pointer}.filter-button.active{background:#c6e8ff;color:#10202f}.search-box input{padding:10px;border-radius:9px;max-width:100%;border:1px solid #8094a6}.trip-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.trip-card{display:block;padding:20px;border-radius:16px;border:1px solid #567084;background:#1d2c3a;color:#fff;text-decoration:none}.trip-card h3{margin:8px 0}.trip-meta{display:flex;gap:6px;flex-wrap:wrap}.trip-meta span,.trip-status{font-size:12px;background:#365264;padding:4px 8px;border-radius:10px}.site-footer{border-top:1px solid #465a6d}.empty-state[hidden]{display:none!important}@media(max-width:600px){.site-header-inner{flex-direction:column;align-items:flex-start}.library-top{align-items:flex-start;flex-direction:column}}</style>
</head>
<body>
<header class="site-header">
<div class="site-header-inner">
<a class="brand" href="./">
<img src="logo.png" alt="">
<span>BookTrip</span>
</a>
<nav aria-label="Navegación principal">
<a href="#library">Viajes</a>
<a href="ejercicio/">Ejercicio</a>
<a href="iceland2026/index.html">Iceland 2026</a>
</nav>
</div>
</header>

<main class="home-shell">
<section class="home-hero">

 
<p class="magic-copy">Un lugar para guardar roadbooks, mapas, reservas y esos detalles que salvan un viaje cuando ya estás en movimiento.</p>

</section>

<section class="library-panel" id="library" aria-label="Biblioteca de viajes">
<div class="library-top">
<div>
<p class="section-kicker">Viajes guardados</p>
<h2>Todos los viajes</h2>
</div>
<span class="trip-count" id="tripCount">0 viajes</span>
</div>

<div class="library-tools">
<label class="search-box">
<span>Buscar</span>
<input id="tripSearch" type="search" placeholder="Islandia, Italia, roadtrip...">
</label>
<div class="filter-row" aria-label="Filtros de viajes">
<button class="filter-button active" type="button" data-filter="all">Todos</button>
<button class="filter-button" type="button" data-filter="dreaming">Soñándolo</button>
<button class="filter-button" type="button" data-filter="planned">Planificando</button>
<button class="filter-button" type="button" data-filter="current">Viviéndolo</button>
<button class="filter-button" type="button" data-filter="finished">Finalizados</button>
</div>
</div>

<section class="trip-grid" id="tripGrid" aria-label="Lista de viajes"></section>
<p class="empty-state" id="emptyState" hidden>No encontré viajes con ese filtro.</p>
</section>
</main>
<footer class="site-footer">
<span>BookTrip</span>
<p>Del sueño al mapa. Del mapa a la memoria.</p>
</footer>
<script src="js/home.js?v=20261010-shenandoah"></script><script>/* Recuperación si el JS principal no se entrega desde Cloudflare */window.addEventListener('load',()=>{const grid=document.getElementById('tripGrid');if(!grid||grid.children.length)return;const fallback=[['Shenandoah National Park 2026','shenandoah2026/','🍁 Skyline Drive, Stony Man, miradores y mapa JARVIS.'],['Navidad Familiar El Salvador 2026','elsalvador2026/','🎄 Roadbook familiar de diciembre y enero.'],['Iceland 2026','iceland2026/','🇮🇸 Roadtrip de Islandia.'],['NYC Thanksgiving 2026','nyc2026/','🗽 Thanksgiving en Nueva York.'],['Suiza 2025','suiza2025/','🏔️ Viaje a Suiza.'],['Italia 2025','italia2025/','🇮🇹 Viaje a Italia.'],['Irlanda 2026','irlanda2026/','☘️ Viaje a Irlanda.']];grid.innerHTML=fallback.map(t=>'<a class="trip-card" href="'+t[1]+'"><span class="trip-status">Viaje</span><h3>'+t[0]+'</h3><p>'+t[2]+'</p></a>').join('');document.getElementById('tripCount').textContent=fallback.length+' viajes';document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));grid.querySelectorAll('.trip-card').forEach(x=>x.hidden=b.dataset.filter!=='all')}));document.getElementById('tripSearch').addEventListener('input',e=>grid.querySelectorAll('.trip-card').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(e.target.value.toLowerCase())))});</script>
</body>
</html>
